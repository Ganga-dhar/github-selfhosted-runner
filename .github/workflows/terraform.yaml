name: Terraform-paln-apply

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  terraform:
    environment: DEV
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # - name: Debug OIDC claims
      #   uses: github/actions-oidc-debugger@v1

      - name: Dump GitHub Context
        run: |
              echo "Repository: ${{ github.repository }}"
              echo "Ref: ${{ github.ref }}"
              echo "Ref Name: ${{ github.ref_name }}"
              echo "Event: ${{ github.event_name }}"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=backend-config-dev.tfvars

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Debug Terraform Files
        run: |
            pwd
            ls -la
            cat main.tf
            ls -la ../../../modules/vpc

      - name: Terraform Plan
        run: terraform plan -var-file=dev.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file=dev.tfvars -var="github_pat=${{ secrets.PAT }}"



        